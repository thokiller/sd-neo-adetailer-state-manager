[Extension]
Name = adetailer-neo-statemanager

# Load after ADetailer-Neo so its components exist first. The panel also sets
# sorting_priority = 100, which is what actually orders the UI; this keeps
# module load order consistent too.
#
# "Requires = adetailer-neo" is deliberately NOT set. This webui registers
# extensions under their raw folder name but lower-cases the names listed in
# Requires before looking them up, so any dependency whose directory contains a
# capital letter - "ADetailer-Neo" included - is reported as missing even when
# it is installed. The dependency is documented in the README instead, and the
# extension already disables itself cleanly when ADetailer-Neo is absent.
[scripts/adetailer_state_manager.py]
After = adetailer-neo
